<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d4269"><title>財務小管家 V8.1.1</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--navy:#103b5c;--bg:#f3f7fa;--card:#fff;--ink:#173247;--muted:#718493;--line:#dde8ef;--blue:#237ed3;--green:#13a078;--orange:#eb8730;--purple:#7658d8;--red:#d84b59;--shadow:0 10px 26px rgba(18,56,82,.08)}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0d3554,#1579a8)}.login-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 24px 65px #0018}.login-card h1{margin:0 0 6px}.login-card p{color:var(--muted);line-height:1.6}.field{margin-top:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.row{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger-btn{background:#fff1f2;color:#ab2633;border:1px solid #efbac0}.msg{margin-top:12px;font-size:13px;line-height:1.6}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}aside{position:sticky;top:0;height:100vh;background:linear-gradient(165deg,#0d3554,#0a4d69);color:#fff;padding:24px 18px}.brand{padding:4px 8px 24px}.brand b{font-size:18px}.brand small{display:block;color:#bdd4df;margin-top:4px}.sync{margin:0 0 18px;padding:10px;border-radius:10px;background:rgba(255,255,255,.1);font-size:12px;line-height:1.5}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#48d6a5;margin-right:6px}.dot.off{background:#ffb44b}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#c9dce6;padding:13px 14px;border-radius:11px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.14);color:#fff}.signout{position:absolute;left:18px;right:18px;bottom:20px}main{padding:28px 32px 44px;max-width:1450px;width:100%;margin:auto}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.card{background:var(--card);border:1px solid #e7eef3;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#0d4269,#177db4);color:#fff;padding:28px}.hero .amount{font-size:clamp(36px,5vw,58px);font-weight:900;margin:8px 0}.pool-list{display:grid;gap:12px;margin-top:18px}.pool{border-radius:16px;color:#fff;overflow:hidden}.green{background:linear-gradient(135deg,#0e946c,#21b98b)}.orange{background:linear-gradient(135deg,#d86e1d,#f29b44)}.purple{background:linear-gradient(135deg,#6044be,#8a6ce2)}.blue{background:linear-gradient(135deg,#1768ba,#318ee2)}.pool-head{width:100%;border:0;background:transparent;color:#fff;padding:18px 20px;display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;text-align:left;cursor:pointer}.pool-value{font-size:25px;font-weight:900}.pool-detail{display:none;border-top:1px solid #ffffff38;padding:16px 20px;background:#0000000c;line-height:1.8;font-size:13px}.pool.open .pool-detail{display:block}.grid{display:grid;gap:17px}.two{grid-template-columns:1.3fr 1fr}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hint{margin-top:13px;padding:12px 14px;background:#eff7ff;border-radius:11px;color:#496a83;font-size:13px;line-height:1.65}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}.table th{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary>div{background:#f4f8fb;padding:15px;border-radius:12px}.summary span{display:block;color:var(--muted);font-size:12px}.summary b{display:block;font-size:20px;margin-top:6px}.toast{position:fixed;right:24px;bottom:24px;background:#153c57;color:#fff;padding:12px 16px;border-radius:11px;opacity:0;transition:.2s}.toast.show{opacity:1}.config{background:#fff8e9;border:1px solid #efd59a;padding:14px;border-radius:12px;margin-bottom:16px;font-size:13px;line-height:1.6}
@media(max-width:900px){.two{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}aside{height:auto;position:relative;padding:14px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;font-size:11px;padding:10px 4px}.signout{position:static;margin-top:10px}main{padding:18px}.form,.summary{grid-template-columns:1fr}.top h1{font-size:23px}}
</style></head><body>
<div id="loginView" class="login"><div class="login-card"><h1>財務小管家 V8.1</h1><p>登入同一帳號，即可在電腦與手機讀取同一份現金池資料。</p><div class="config"><b>安全連線已設定</b><br>此版本已連接正式雲端，不需輸入 Project URL 或金鑰。</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="field"><label>電子郵件</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password" minlength="6"></div><div class="row"><button class="btn primary" onclick="signIn()">登入</button><button class="btn secondary" onclick="signUp()">建立帳號</button></div><div id="loginMsg" class="msg"></div></div></div>
<div id="appView" class="app hidden"><aside><div class="brand"><b>財務小管家 V8.1</b><small id="userEmail"></small></div><div class="sync"><span id="syncDot" class="dot"></span><span id="syncText">已同步</span><br><span id="syncTime"></span></div><div class="nav"><button class="active" data-page="cashpool">▦ 現金池</button><button data-page="records">＋ 收入與支出</button><button data-page="annual">✈ 年度支出</button><button data-page="settings">⚙ 設定</button></div><button class="btn danger-btn signout" onclick="signOut()">登出</button></aside><main>
<section id="cashpool" class="page active"><div class="top"><div><h1>現金池</h1><p>雲端同步版</p></div><button class="btn secondary" onclick="loadCloud()">立即同步</button></div><div class="card hero"><small>薪資帳戶應有總額</small><div class="amount" id="poolTotal"></div><small>緊急備用金＋年度支出金＋上月自由餘額＋本月剩餘現金</small></div><div class="pool-list"><div class="pool green open" id="p1"><button class="pool-head" onclick="togglePool('p1')"><span>緊急備用金</span><span class="pool-value" id="emValue"></span><span>⌄</span></button><div class="pool-detail" id="emDetail"></div></div><div class="pool orange" id="p2"><button class="pool-head" onclick="togglePool('p2')"><span>年度支出金</span><span class="pool-value" id="annualValue"></span><span>⌄</span></button><div class="pool-detail" id="annualDetail"></div></div><div class="pool purple" id="p3"><button class="pool-head" onclick="togglePool('p3')"><span>上月自由餘額</span><span class="pool-value" id="carryValue"></span><span>⌄</span></button><div class="pool-detail">本月以前未使用的自由資金。</div></div><div class="pool blue" id="p4"><button class="pool-head" onclick="togglePool('p4')"><span>本月剩餘現金</span><span class="pool-value" id="monthValue"></span><span>⌄</span></button><div class="pool-detail" id="monthDetail"></div></div></div></section>
<section id="records" class="page"><div class="top"><div><h1>收入與支出</h1><p>儲存後自動上傳雲端。</p></div></div><div class="grid two"><div class="card"><h2>收入</h2><div class="form"><div class="field"><label>日期</label><input id="incomeDate" type="date"></div><div class="field"><label>固定薪資</label><input id="salary" type="number"></div><div class="field"><label>加班費</label><input id="ot" type="number"></div><div class="field"><label>獎金</label><input id="bonus" type="number"></div></div><button class="btn primary" style="margin-top:14px" onclick="saveIncome()">儲存收入</button></div><div class="card"><h2>支出</h2><div class="form"><div class="field"><label>日期</label><input id="expenseDate" type="date"></div><div class="field"><label>生活費已花</label><input id="lifeSpent" type="number"></div><div class="field"><label>娛樂費已花</label><input id="funSpent" type="number"></div></div><button class="btn primary" style="margin-top:14px" onclick="saveExpense()">儲存支出</button></div></div></section>
<section id="annual" class="page"><div class="top"><div><h1>年度支出</h1><p>各項目按月固定提撥，達標自動停止。</p></div></div><div class="card"><div class="form"><div class="field"><label>名稱</label><input id="annName"></div><div class="field"><label>目標金額</label><input id="annGoal" type="number"></div><div class="field"><label>目前已存</label><input id="annSaved" type="number"></div><div class="field"><label>每月提撥</label><input id="annMonthly" type="number"></div></div><button class="btn primary" style="margin-top:14px" onclick="addAnnual()">新增</button></div><div class="card" style="margin-top:17px"><div class="table-wrap"><table class="table"><thead><tr><th>項目</th><th>目標</th><th>已存</th><th>每月提撥</th><th>本月應提撥</th><th></th></tr></thead><tbody id="annTable"></tbody></table></div></div></section>
<section id="settings" class="page"><div class="top"><div><h1>設定</h1><p>所有設定會同步到同一帳號。</p></div></div><div class="card"><div class="form"><div class="field"><label>薪資投資比例 %</label><input id="salaryInv" type="number"></div><div class="field"><label>獎金投資比例 %</label><input id="bonusInv" type="number"></div><div class="field"><label>每月生活預算</label><input id="lifeBudget" type="number"></div><div class="field"><label>上月自由餘額</label><input id="carry" type="number"></div><div class="field"><label>每月必要生活費</label><input id="essential" type="number"></div><div class="field"><label>備用金目標月數</label><input id="months" type="number"></div><div class="field"><label>備用金目前已存</label><input id="emSaved" type="number"></div><div class="field"><label>每月補充上限</label><input id="emCap" type="number"></div></div><button class="btn primary" style="margin-top:14px" onclick="saveSettings()">儲存設定</button><button class="btn secondary" style="margin-top:14px" onclick="resetCloudData()">初始化我的雲端資料</button></div></section>
</main></div><div class="toast" id="toast"></div>
<script>
const today=()=>new Date().toISOString().slice(0,10);const blank=()=>({version:8,income:{date:today(),salary:0,ot:0,bonus:0},expense:{date:today(),life:0,fun:0},settings:{salaryInv:50,bonusInv:70,lifeBudget:0,carry:0,essential:0,months:12,emSaved:0,emCap:0},annual:[],history:[],updatedAt:new Date().toISOString()});let data=blank(),client=null,currentUser=null,saving=false;const $=id=>document.getElementById(id),money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function cfg(){return{url:'https://gjuunpewhrvstucpjuzr.supabase.co',key:'sb_publishable_OGREbqv7lXUlqs6aStGiaA_jnplno-7'}}function saveCloudConfig(){const url=$('sbUrl').value.trim(),key=$('sbKey').value.trim();if(!url||!key)return showLogin('請填入 Project URL 與 Publishable Key。',true);localStorage.setItem('v8_sb_url',url);localStorage.setItem('v8_sb_key',key);initClient();showLogin('雲端設定已儲存。',false)}function initClient(){const c=cfg();const urlField=$('sbUrl'),keyField=$('sbKey');if(urlField)urlField.value=c.url;if(keyField)keyField.value=c.key;if(!c.url||!c.key)return false;if(!window.supabase){showLogin('雲端登入元件載入失敗，請重新整理頁面或檢查網路連線。',true);return false}client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}function showLogin(t,bad){$('loginMsg').textContent=t;$('loginMsg').style.color=bad?'#b72b38':'#087b59'}async function signUp(){try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return showLogin('請先輸入電子郵件與密碼。',true);if(!client&&!initClient())return showLogin('雲端服務尚未成功載入，請重新整理頁面。',true);showLogin('正在建立帳號...',false);const{error}=await client.auth.signUp({email,password});if(error)return showLogin('建立帳號失敗：'+error.message,true);showLogin('帳號已建立。若已啟用 Email confirmation，請到信箱完成驗證後再登入。',false)}catch(e){showLogin('建立帳號時發生錯誤：'+(e.message||e),true)}}async function signIn(){try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return showLogin('請先輸入電子郵件與密碼。',true);if(!client&&!initClient())return showLogin('雲端服務尚未成功載入，請重新整理頁面。',true);showLogin('正在登入...',false);const{data:r,error}=await client.auth.signInWithPassword({email,password});if(error)return showLogin('登入失敗：'+error.message,true);await enter(r.user)}catch(e){showLogin('登入時發生錯誤：'+(e.message||e),true)}}async function signOut(){await client.auth.signOut();currentUser=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
let sessionGuardInstalled=false;function installSessionSecurity(){if(sessionGuardInstalled)return;sessionGuardInstalled=true;const IDLE=15*60*1000,BG=5*60*1000,ABS=8*60*60*1000;let last=Date.now(),hiddenAt=null,started=Number(sessionStorage.getItem('financeSignedInAt'))||Date.now(),busy=false;sessionStorage.setItem('financeSignedInAt',String(started));['pointerdown','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,()=>last=Date.now(),{passive:true}));async function timeoutLogout(reason){if(busy)return;busy=true;sessionStorage.removeItem('financeSignedInAt');sessionStorage.setItem('financeLogoutReason',reason);try{if(client)await client.auth.signOut({scope:'local'})}finally{currentUser=null;data=blank();location.reload()}}document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else{if(hiddenAt&&Date.now()-hiddenAt>=BG)return timeoutLogout('背景超過 5 分鐘，已自動登出');hiddenAt=null;last=Date.now()}});setInterval(()=>{const now=Date.now();if(now-last>=IDLE)timeoutLogout('閒置超過 15 分鐘，已自動登出');else if(now-started>=ABS)timeoutLogout('登入已滿 8 小時，已自動登出')},15000)}function showLogoutReason(){const r=sessionStorage.getItem('financeLogoutReason');if(r){sessionStorage.removeItem('financeLogoutReason');showLogin(r,true)}}async function enter(user){currentUser=user;$('userEmail').textContent=user.email||'';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadCloud();installSessionSecurity()}function syncState(text,offline=false){$('syncText').textContent=text;$('syncDot').classList.toggle('off',offline);$('syncTime').textContent=new Date().toLocaleString('zh-TW')}
async function loadCloud(){if(!currentUser)return;syncState('同步中...');const{data:r,error}=await client.from('finance_profiles').select('data,updated_at').eq('user_id',currentUser.id).maybeSingle();if(error){syncState('同步失敗',true);return toast(error.message)}if(!r){data=blank();await saveCloud()}else data=r.data||blank();render();syncState('已同步')}
async function saveCloud(){if(!currentUser||saving)return;saving=true;syncState('儲存中...');data.updatedAt=new Date().toISOString();const{error}=await client.from('finance_profiles').upsert({user_id:currentUser.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});saving=false;if(error){syncState('儲存失敗',true);toast(error.message);return false}syncState('已同步');return true}
function escapeHtml(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function togglePool(id){$(id).classList.toggle('open')}function due(a){return Math.max(0,Math.min(+a.monthly||0,(+a.goal||0)-(+a.saved||0)))}function calc(){const i=data.income,s=data.settings,cash=i.salary*(1-s.salaryInv/100)+i.ot+i.bonus*(1-s.bonusInv/100),goal=s.essential*s.months,gap=Math.max(0,goal-s.emSaved),em=Math.min(cash,gap,s.emCap),annual=data.annual.reduce((n,a)=>n+due(a),0),usable=Math.max(0,cash-em-annual),life=Math.min(s.lifeBudget,usable),fun=Math.max(0,usable-life),lr=life-data.expense.life,fr=fun-data.expense.fun,saved=data.annual.reduce((n,a)=>n+(+a.saved||0),0);return{cash,goal,gap,em,annual,life,fun,lr,fr,current:lr+fr,annualSaved:saved,total:s.emSaved+saved+s.carry+Math.max(0,lr+fr)}}
function render(){const c=calc(),s=data.settings;$('poolTotal').textContent=money(c.total);$('emValue').textContent=money(s.emSaved);$('emDetail').innerHTML=`目標 ${money(c.goal)}<br>缺口 ${money(c.gap)}<br>本月建議補充 ${money(c.em)}`;$('annualValue').textContent=money(c.annualSaved);$('annualDetail').innerHTML=`${data.annual.length} 個項目<br>本月應提撥 ${money(c.annual)}`;$('carryValue').textContent=money(s.carry);$('monthValue').textContent=money(c.current);$('monthDetail').innerHTML=`生活剩餘 ${money(c.lr)}<br>娛樂剩餘 ${money(c.fr)}<br>本月現金池收入 ${money(c.cash)}`;$('incomeDate').value=data.income.date||today();$('salary').value=data.income.salary;$('ot').value=data.income.ot;$('bonus').value=data.income.bonus;$('expenseDate').value=data.expense.date||today();$('lifeSpent').value=data.expense.life;$('funSpent').value=data.expense.fun;['salaryInv','bonusInv','lifeBudget','carry','essential','months','emSaved','emCap'].forEach(k=>$(k).value=s[k]);renderAnnual()}
async function saveIncome(){data.income={date:$('incomeDate').value||today(),salary:+$('salary').value||0,ot:+$('ot').value||0,bonus:+$('bonus').value||0};render();if(await saveCloud())toast('收入已同步')}async function saveExpense(){data.expense={date:$('expenseDate').value||today(),life:+$('lifeSpent').value||0,fun:+$('funSpent').value||0};render();if(await saveCloud())toast('支出已同步')}async function saveSettings(){['salaryInv','bonusInv','lifeBudget','carry','essential','months','emSaved','emCap'].forEach(k=>data.settings[k]=+$(k).value||0);render();if(await saveCloud())toast('設定已同步')}async function addAnnual(){const name=$('annName').value.trim(),goal=+$('annGoal').value||0,monthly=+$('annMonthly').value||0;if(!name||goal<=0||monthly<=0)return toast('請輸入名稱、目標與每月提撥');data.annual.push({id:crypto.randomUUID(),name,goal,saved:+$('annSaved').value||0,monthly});render();if(await saveCloud())toast('年度項目已同步')}function renderAnnual(){$('annTable').innerHTML=data.annual.map(a=>`<tr><td><b>${escapeHtml(a.name)}</b></td><td>${money(a.goal)}</td><td>${money(a.saved)}</td><td>${money(a.monthly)}</td><td>${money(due(a))}</td><td><button class="btn secondary" onclick="editAnnual('${a.id}')">更新</button> <button class="btn danger-btn" onclick="deleteAnnual('${a.id}')">刪除</button></td></tr>`).join('')||'<tr><td colspan="6">尚無項目</td></tr>'}async function editAnnual(id){const a=data.annual.find(x=>x.id===id),v=prompt('目前已存',a.saved);if(v===null)return;a.saved=Math.max(0,+v||0);render();await saveCloud()}async function deleteAnnual(id){data.annual=data.annual.filter(a=>a.id!==id);render();await saveCloud()}async function resetCloudData(){if(!confirm('確定初始化此帳號的雲端資料？此操作無法復原。'))return;data=blank();render();await saveCloud();toast('雲端資料已初始化')}
(async()=>{showLogoutReason();if(!initClient())return;const{data:s}=await client.auth.getSession();if(s.session)await enter(s.session.user);client.auth.onAuthStateChange(async(e,session)=>{if(e==='SIGNED_IN'&&session&&!currentUser)await enter(session.user)})})();
</script></body></html>
